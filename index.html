<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薬学実習クイズ</title>
  <!-- 見出し用の明朝体と、本文用のゴシック体をGoogleフォントから読み込む -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="theme-color" content="#1B2A4A">
</head>
<body>
  <header class="app-header">
    <h1>薬学実習クイズ</h1>
    <p id="streak-display" class="streak-display"></p>
  </header>

  <nav class="app-nav">
    <button data-screen="home-screen">ホーム</button>
    <button data-screen="quiz-screen">クイズ</button>
    <button data-screen="stats-screen">正答率</button>
    <button data-screen="bookmark-screen">ブックマーク</button>
  </nav>

  <main>
    <section id="home-screen" class="screen">
      <h2>カテゴリーを選んでください</h2>
      <div id="category-list"></div>
      <button id="weak-point-button">弱点復習モードで始める</button>
    </section>

    <!-- カテゴリーを選んだあとに出る、初級・中級・上級を選ぶ画面 -->
    <section id="difficulty-screen" class="screen" hidden>
      <button id="difficulty-back-button" class="back-button">カテゴリー一覧に戻る</button>
      <h2 id="difficulty-title"></h2>
      <div id="difficulty-list"></div>
    </section>

    <section id="quiz-screen" class="screen" hidden>
      <!-- 問題番号と、正解時に判子が現れる場所を横に並べた帯。
           判子はこの帯の中だけに出るので、問題文や選択肢の上に重なることがない -->
      <div class="quiz-topbar">
        <p id="quiz-progress"></p>
        <div id="hanko-slot"></div>
      </div>
      <!-- 何問目まで来たかを棒の長さで示すバー。中の緑の部分をJavaScriptで伸ばす -->
      <div class="quiz-progress-track">
        <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
      </div>
      <h2 id="question-text"></h2>
      <div id="choice-list"></div>
      <div id="answer-feedback" hidden>
        <p id="feedback-result"></p>
        <p id="feedback-explanation"></p>
        <p id="feedback-source"></p>
        <button id="bookmark-toggle-button">☆ ブックマーク</button>
        <button id="next-question-button">次の問題へ</button>
      </div>
    </section>

    <!-- 10問を解き終えたときに出る結果画面 -->
    <section id="result-screen" class="screen" hidden>
      <!-- 成績のまとめ。1枚のカードにして「区切りがついた」感じを出す -->
      <div class="result-card">
        <p class="result-eyebrow" id="result-eyebrow"></p>
        <h2>おつかれさまでした</h2>
        <!-- 正答率を表す円グラフ。緑に塗る割合(--pct)をJavaScriptで指定する -->
        <div class="score-ring" id="score-ring">
          <span class="score-ring-inner">
            <span class="score-ring-pct" id="score-ring-pct">0</span><span class="score-ring-unit">%</span>
          </span>
        </div>
        <p id="result-score"></p>
        <!-- 正解数と不正解数を、色分けした札で並べる -->
        <div class="result-chips">
          <span class="result-chip is-correct">正解 <b id="result-correct-count">0</b></span>
          <span class="result-chip is-wrong">不正解 <b id="result-wrong-count">0</b></span>
        </div>
        <p id="result-comment"></p>
      </div>

      <!-- 今回出た問題の一覧。1行ずつ開くと解説を読み返せる -->
      <h3 class="section-title" id="result-review-title">今回の問題をふりかえる</h3>
      <div id="result-review-list"></div>

      <div class="result-actions">
        <button id="retry-button">もう一度解く</button>
        <button id="other-difficulty-button">別の難易度を選ぶ</button>
        <button id="back-home-button">ホームに戻る</button>
      </div>
    </section>

    <section id="stats-screen" class="screen" hidden>
      <h2>カテゴリー別 正答率</h2>
      <div id="stats-list"></div>
    </section>

    <section id="bookmark-screen" class="screen" hidden>
      <h2>ブックマークした問題</h2>
      <div id="bookmark-list"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
